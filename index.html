
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 주변 장소 검색</title>

    <!-- 카카오 지도 SDK를 불러옵니다. -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=09ecc13bc06db3f0c313c32b6506454a&libraries=services&autoload=false"
        defer
    ></script>

    <style>
        /* 모든 요소의 크기 계산 방식을 통일합니다. */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 나눕니다. */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역을 설정합니다. */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: 360px;
            min-width: 300px;
            border-right: 1px solid #ddd;
            background: #fff;
        }

        .header {
            padding: 24px 20px 16px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 13px;
        }

        /* 검색창과 검색 버튼을 나란히 배치합니다. */
        .search-box {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: #fee500;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background: #f4dc00;
        }

        /* 현재 상태와 검색 결과를 표시합니다. */
        #statusMessage {
            padding: 0 20px 12px;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        #resultList {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        .result-item {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover,
        .result-item:focus {
            background: #fffbea;
            outline: none;
        }

        .place-name {
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-address {
            margin-bottom: 6px;
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }

        .place-category {
            color: #999;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #1769aa;
            font-size: 12px;
            text-decoration: none;
        }

        /* 오른쪽 지도 영역을 설정합니다. */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #f2f2f2;
        }

        /* 화면이 좁으면 검색 영역을 줄입니다. */
        @media (max-width: 600px) {
            .sidebar {
                width: 42%;
                min-width: 170px;
            }

            .header {
                padding: 18px 12px 12px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header p {
                font-size: 11px;
            }

            .search-box {
                gap: 5px;
                padding: 0 8px 12px;
            }

            #searchInput {
                padding: 9px 6px;
                font-size: 12px;
            }

            #searchButton {
                padding: 0 8px;
                font-size: 12px;
            }

            .result-item {
                padding: 12px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽에 검색창과 결과 목록을 배치합니다. -->
        <aside class="sidebar">
            <div class="header">
                <h1>장소 검색</h1>
                <p>원하는 장소를 검색해 보세요.</p>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="예: 카페, 도서관, 학교"
                    aria-label="검색할 장소"
                >
                <button id="searchButton" type="button">검색</button>
            </div>

            <div id="statusMessage" role="status">
                지도를 불러오는 중입니다...
            </div>

            <div id="resultList"></div>
        </aside>

        <!-- 오른쪽에 카카오 지도를 표시합니다. -->
        <main id="map" aria-label="카카오 지도"></main>
    </div>

    <script>
        // 지도와 장소 검색에 사용할 변수를 선언합니다.
        let map = null;
        let placesService = null;
        let currentLocationMarker = null;
        let placeMarkers = [];
        let infoWindow = null;

        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const resultList = document.getElementById("resultList");
        const statusMessage = document.getElementById("statusMessage");

        // 사용자에게 현재 상태를 안내합니다.
        function showStatus(message) {
            statusMessage.textContent = message;
        }

        // 카카오 지도 SDK가 준비되었는지 확인합니다.
        function startMap() {
            if (!window.kakao || !window.kakao.maps) {
                showStatus(
                    "지도 SDK를 불러오지 못했습니다. API 키와 도메인을 확인해 주세요."
                );
                return;
            }

            // 지도 SDK 로딩이 완료된 후 초기화합니다.
            kakao.maps.load(function () {
                try {
                    initializeMap();
                } catch (error) {
                    console.error("지도 초기화 오류:", error);
                    showStatus("지도 초기화에 실패했습니다.");
                }
            });
        }

        // 지도와 검색 기능을 초기화합니다.
        function initializeMap() {
            const defaultPosition = new kakao.maps.LatLng(
                37.5665,
                126.9780
            );

            const mapContainer = document.getElementById("map");

            // 서울 시청을 기본 위치로 설정하고 확대 레벨을 5로 지정합니다.
            map = new kakao.maps.Map(mapContainer, {
                center: defaultPosition,
                level: 5
            });

            // 카카오 장소 검색 서비스를 생성합니다.
            placesService = new kakao.maps.services.Places(map);

            // 장소를 선택했을 때 사용할 정보창을 생성합니다.
            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 3
            });

            // 검색 버튼과 Enter 키에 검색 기능을 연결합니다.
            searchButton.addEventListener("click", searchPlaces);

            searchInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    searchPlaces();
                }
            });

            // 지도가 생성된 뒤 현재 위치를 요청합니다.
            requestCurrentLocation();
        }

        // 브라우저에 현재 위치 권한을 요청합니다.
        function requestCurrentLocation() {
            if (!navigator.geolocation) {
                showStatus(
                    "현재 위치 기능을 지원하지 않습니다. 기본 위치에서 검색할 수 있습니다."
                );
                return;
            }

            showStatus("현재 위치 권한을 확인하고 있습니다...");

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    const currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 현재 위치를 지도의 중심으로 설정합니다.
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    // 현재 위치에 마커를 표시합니다.
                    currentLocationMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: "현재 위치"
                    });

                    showStatus(
                        "현재 위치를 확인했습니다. 원하는 장소를 검색해 보세요."
                    );
                },
                function (error) {
                    // 위치 권한이 없더라도 기본 지도는 사용할 수 있습니다.
                    console.warn("현재 위치 확인 실패:", error.message);

                    if (error.code === 1) {
                        showStatus(
                            "위치 권한이 거부되었습니다. 기본 위치에서 검색할 수 있습니다."
                        );
                    } else if (error.code === 2) {
                        showStatus(
                            "현재 위치를 확인할 수 없습니다. 기본 위치에서 검색할 수 있습니다."
                        );
                    } else if (error.code === 3) {
                        showStatus(
                            "위치 확인 시간이 초과되었습니다. 기본 위치에서 검색할 수 있습니다."
                        );
                    } else {
                        showStatus(
                            "현재 위치를 확인하지 못했습니다. 기본 위치에서 검색할 수 있습니다."
                        );
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 이전 검색 결과의 마커와 정보창을 제거합니다.
        function clearPlaceMarkers() {
            placeMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            placeMarkers = [];
            infoWindow.close();
        }

        // 입력한 키워드로 장소를 검색합니다.
        function searchPlaces() {
            if (!map || !placesService) {
                showStatus("지도가 아직 준비되지 않았습니다.");
                return;
            }

            const keyword = searchInput.value.trim();

            if (keyword === "") {
                showStatus("검색할 장소를 입력해 주세요.");
                searchInput.focus();
                return;
            }

            clearPlaceMarkers();
            resultList.replaceChildren();
            showStatus("장소를 검색하고 있습니다...");

            // 지도 중심에서 반경 20km 이내의 장소를 검색합니다.
            const searchOptions = {
                location: map.getCenter(),
                radius: 20000,
                size: 15
            };

            placesService.keywordSearch(
                keyword,
                function (data, status) {
                    handleSearchResults(data, status);
                },
                searchOptions
            );
        }

        // 검색 결과에 따라 안내 문구와 장소 목록을 갱신합니다.
        function handleSearchResults(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                showStatus("검색 결과 " + data.length + "개");

                data.forEach(function (place, index) {
                    displayPlace(place, index);
                });

                // 첫 번째 검색 장소를 중심으로 지도를 이동합니다.
                if (data.length > 0) {
                    const firstPlace = new kakao.maps.LatLng(
                        data[0].y,
                        data[0].x
                    );

                    map.panTo(firstPlace);
                }
            } else if (
                status === kakao.maps.services.Status.ZERO_RESULT
            ) {
                showStatus(
                    "검색 결과가 없습니다. 다른 검색어를 입력해 보세요."
                );
            } else {
                showStatus(
                    "검색 중 오류가 발생했습니다. API 설정을 확인해 주세요."
                );
                console.error("장소 검색 오류:", status);
            }
        }

        // 검색 결과를 지도 마커와 왼쪽 목록에 표시합니다.
        function displayPlace(place, index) {
            const position = new kakao.maps.LatLng(
                place.y,
                place.x
            );

            // 장소 위치에 마커를 생성합니다.
            const marker = new kakao.maps.Marker({
                map: map,
                position: position,
                title: place.place_name
            });

            placeMarkers.push(marker);

            // 지도 마커를 클릭하면 해당 장소를 선택합니다.
            kakao.maps.event.addListener(marker, "click", function () {
                selectPlace(place, marker);
            });

            // 검색 결과 항목을 생성합니다.
            const item = document.createElement("div");
            item.className = "result-item";
            item.tabIndex = 0;

            const name = document.createElement("div");
            name.className = "place-name";
            name.textContent = (index + 1) + ". " + place.place_name;

            const address = document.createElement("div");
            address.className = "place-address";
            address.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            const category = document.createElement("div");
            category.className = "place-category";
            category.textContent =
                place.category_name || "분류 정보 없음";

            item.append(name, address, category);

            // 카카오맵의 장소 상세 페이지 링크를 추가합니다.
            if (place.place_url) {
                const link = document.createElement("a");

                link.className = "place-link";
                link.href = place.place_url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "카카오맵에서 자세히 보기";

                link.addEventListener("click", function (event) {
                    event.stopPropagation();
                });

                item.appendChild(link);
            }

            // 목록을 클릭하면 해당 장소로 이동합니다.
            item.addEventListener("click", function () {
                selectPlace(place, marker);
            });

            item.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    selectPlace(place, marker);
                }
            });

            resultList.appendChild(item);
        }

        // 장소를 선택하면 지도를 이동하고 이름을 표시합니다.
        function selectPlace(place, marker) {
            const position = new kakao.maps.LatLng(
                place.y,
                place.x
            );

            map.panTo(position);

            // 장소 이름을 HTML 문자열 대신 안전한 텍스트로 표시합니다.
            const content = document.createElement("div");
            content.style.cssText =
                "padding:10px;font-size:13px;white-space:nowrap;";
            content.textContent = place.place_name;

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // 페이지 로딩이 끝난 뒤 지도 SDK를 확인합니다.
        window.addEventListener("load", startMap);
    </script>
</body>
</html>
